<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VPN Bunker</title>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        /* ГЛОБАЛЬНЫЙ СБРОС */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0D0F14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Share Tech Mono', monospace;
            padding: 20px;
        }

        /* КАРТОЧКА-БУНКЕР */
        .bunker {
            background: #1A1D24;
            border: 2px solid #2E333D;
            border-radius: 8px;
            padding: 40px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Эффект "сканирования" (текстура) */
        .bunker::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 8px;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.3) 0px,
                rgba(255,255,255,0.02) 2px,
                transparent 4px
            );
        }

        /* ЗАГОЛОВОК */
        .title {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
            color: #E8B84B;
            text-transform: uppercase;
            text-align: center;
            border-bottom: 1px solid #2E333D;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(232,184,75,0.15);
        }

        /* СТАТУС (лампочка) */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .bulb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #E54B4B;
            box-shadow: 0 0 20px rgba(229,75,75,0.6);
            transition: all 0.3s ease;
        }

        .bulb.protected {
            background: #4BDB9B;
            box-shadow: 0 0 25px rgba(75,219,155,0.7);
        }

        .status-text {
            font-size: 18px;
            letter-spacing: 1.5px;
            color: #C5C9D3;
        }

        .status-text span {
            color: #E54B4B;
            transition: 0.3s;
        }

        .status-text .on {
            color: #4BDB9B;
        }

        /* ИНДИКАТОР СЕРВЕРА */
        .server-info {
            background: #0D0F14;
            border: 1px solid #2E333D;
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7A8294;
        }

        .server-info .code {
            color: #E8B84B;
            font-weight: bold;
        }

        /* ГЛАВНАЯ КНОПКА-РУБИЛЬНИК */
        .toggle-btn {
            width: 100%;
            padding: 18px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: #2E333D;
            color: #7A8294;
            border: 2px solid #3D444F;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 20px;
        }

        .toggle-btn.active {
            background: #E8B84B;
            color: #0D0F14;
            border-color: #E8B84B;
            box-shadow: 0 0 30px rgba(232,184,75,0.25);
        }

        .toggle-btn:hover {
            transform: scale(1.01);
        }

        /* ДЕТАЛИ (ПИНГ, IP) */
        .details {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5C667A;
            letter-spacing: 0.5px;
            border-top: 1px solid #2E333D;
            padding-top: 16px;
        }

        .details .value {
            color: #C5C9D3;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- React + ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- НАШ КОМПОНЕНТ -->
    <script>
        const { useState } = React;

        function VPNCard() {
            const [isConnected, setIsConnected] = useState(false);

            return (
                <div className="bunker">
                    {/* Заголовок */}
                    <div className="title">⏣ Secure Bunker</div>

                    {/* Статус с лампочкой */}
                    <div className="status">
                        <div className={`bulb ${isConnected ? 'protected' : ''}`}></div>
                        <div className="status-text">
                            Status: <span className={isConnected ? 'on' : ''}>
                                {isConnected ? 'PROTECTED' : 'EXPOSED'}
                            </span>
                        </div>
                    </div>

                    {/* Инфо о сервере */}
                    <div className="server-info">
                        <span>Server</span>
                        <span className="code">{isConnected ? '● EU-02' : '◌ DISCONNECTED'}</span>
                    </div>

                    {/* Кнопка-рубильник */}
                    <button
                        className={`toggle-btn ${isConnected ? 'active' : ''}`}
                        onClick={() => setIsConnected(!isConnected)}
                    >
                        {isConnected ? '⟡ BREAK CONNECTION' : '⚡ CONNECT'}
                    </button>

                    {/* Технические детали */}
                    <div className="details">
                        <span>PING <span className="value">{isConnected ? '12ms' : '—'}</span></span>
                        <span>IP <span className="value">{isConnected ? '10.0.2.44' : '0.0.0.0'}</span></span>
                        <span>UPTIME <span className="value">{isConnected ? '04:32' : '00:00'}</span></span>
                    </div>
                </div>
            );
        }

        // Рендерим в root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VPNCard />);
    </script>

</body>
</html>
